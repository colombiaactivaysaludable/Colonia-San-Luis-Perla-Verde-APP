<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="pearlGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d1fae5" />
      <stop offset="70%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />

  <!-- Mountain Silhouette (Montañas de San Luis, Antioquia) -->
  <path d="M60 380 L180 230 L260 310 L370 190 L452 380 Z" fill="#044e39" opacity="0.7" />
  <path d="M120 380 L230 250 L310 330 L390 240 L452 380 Z" fill="#022c22" opacity="0.9" />

  <!-- Water River / Wave (Río Dormilón) -->
  <path d="M60 410 Q 180 370 256 410 T 452 410 L 452 450 Q 332 420 256 450 T 60 450 Z" fill="#34d399" opacity="0.6" />

  <!-- Outer Pearl Aura -->
  <circle cx="256" cy="200" r="96" fill="url(#pearlGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- The Emerald Pearl ("Perla Verde") -->
  <circle cx="256" cy="200" r="76" fill="url(#pearlGrad)" stroke="#ffffff" stroke-width="4" />
  
  <!-- Pearl Shimmer Highlight -->
  <ellipse cx="232" cy="176" rx="24" ry="14" transform="rotate(-30 232 176)" fill="#ffffff" opacity="0.85" />
  <circle cx="270" cy="216" r="6" fill="#ffffff" opacity="0.6" />

  <!-- Football / Soccer Ball Icon Overlay inside Pearl -->
  <g transform="translate(256, 200) scale(0.72) translate(-256, -200)" opacity="0.95">
    <circle cx="256" cy="200" r="46" fill="none" stroke="#064e3b" stroke-width="5" />
    <!-- Ball Patches -->
    <polygon points="256,182 272,194 266,212 246,212 240,194" fill="#064e3b" />
    <line x1="256" y1="182" x2="256" y2="164" stroke="#064e3b" stroke-width="4" />
    <line x1="272" y1="194" x2="290" y2="198" stroke="#064e3b" stroke-width="4" />
    <line x1="266" y1="212" x2="278" y2="228" stroke="#064e3b" stroke-width="4" />
    <line x1="246" y1="212" x2="234" y2="228" stroke="#064e3b" stroke-width="4" />
    <line x1="240" y1="194" x2="222" y2="198" stroke="#064e3b" stroke-width="4" />
  </g>

  <!-- Banner Ribbon / Text Frame -->
  <rect x="56" y="324" width="400" height="52" rx="14" fill="#022c22" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="256" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">
    COLONIA SAN LUIS
  </text>

  <!-- Eslogan -->
  <text x="256" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-style="italic" font-weight="700" fill="#a7f3d0" text-anchor="middle">
    "La Perla Bonita de Antioquia"
  </text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="3">
    PERLA VERDE · FÚTBOL
  </text>
</svg>
